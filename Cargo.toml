[package]
name = "stormstar"
version = "0.4.0"
edition = "2021"
authors = ["Glenn West"]
description = "Lightweight RPM and APT content management for edge deployments"
repository = "https://github.com/glennswest/stormstar"
license = "MIT"
rust-version = "1.75"

[lib]
name = "stormstar"
path = "src/lib.rs"

[[bin]]
name = "stormstar"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Web framework
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "cors"] }

# HTTP client (repo sync, CLI calls)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }

# Database (native_db backed by redb)
native_db = "0.8"
native_model = "0.4"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# RPM ecosystem
quick-xml = { version = "0.37", features = ["serialize"] }
flate2 = "1"
rpm = "0.16"

# CLI
clap = { version = "4", features = ["derive"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Crypto / hashing
sha2 = "0.10"
hex = "0.4"

# IDs and time
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# TLS
rustls = "0.23"
tokio-rustls = "0.26"
rustls-pemfile = "2"

# Scheduling
cron = "0.13"

# Metrics
metrics = "0.24"
metrics-exporter-prometheus = "0.16"

# Misc
once_cell = "1"
regex = "1"
futures = "0.3"

[dev-dependencies]
tempfile = "3"
